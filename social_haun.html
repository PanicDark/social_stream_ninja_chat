<!DOCTYPE html>
<html lang="en">
	<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Chat Overlay: a Social Stream Ninja chat overlay for OBS. Use your session link to display live messages from your connected chat sources.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="../../icons/favicon.ico" type="image/x-icon">
<script src="libs/objects.js"></script>
<script src="../../shared/utils/chatHtml.js"></script>
<script src="../../shared/utils/chatBadges.js"></script>
<link rel="stylesheet" href="../../shared/utils/chatBadges.css">
  <script type="text/javascript" src="../../js/local-server-url.js"></script>

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chat Overlay</title>
</head>

	<body>
		<div id="chat-container"></div>
		<script>
			const chatContainer = document.getElementById("chat-container");
			let lastSender = null;
			let lastMessageDiv = null;

			const urlParams = new URLSearchParams(window.location.search);
			const SERVER_EXCLUSIVE_TRANSPORT_VERSION = "3.52.0";
			// Transport migration guard: only pages with full server parity may skip the legacy bridge.
			var TRANSPORT_CAPABILITIES = {
				serverFeed: true,
				serverTargeted: false,
				upstreamCommands: false,
				customChannel: false,
				legacyBridgeRequired: false,
				exclusiveServerParams: { server: false, server2: true, server3: false }
			};
			function versionAtLeast(value, minimum) {
				const a = String(value || "").split(".");
				const b = String(minimum || "").split(".");
				const len = Math.max(a.length, b.length);
				for (let i = 0; i < len; i++) {
					const av = parseInt(a[i], 10) || 0;
					const bv = parseInt(b[i], 10) || 0;
					if (av > bv) return true;
					if (av < bv) return false;
				}
				return true;
			}
			// Only feed-carrying server params listed by this page may disable the bridge; server3 alone is command-only.
			function hasExclusiveServerTransport(caps) {
				var params = caps && typeof caps.exclusiveServerParams === "object" ? caps.exclusiveServerParams : { server2: true };
				return (params.server === true && urlParams.has("server")) ||
					(params.server2 !== false && urlParams.has("server2")) ||
					(params.server3 === true && urlParams.has("server2") && urlParams.has("server3"));
			}
			function useServerOnlyTransport() {
				var caps = (typeof TRANSPORT_CAPABILITIES === "object" && TRANSPORT_CAPABILITIES) ? TRANSPORT_CAPABILITIES : {};
				return hasExclusiveServerTransport(caps) &&
					versionAtLeast(urlParams.get("v"), SERVER_EXCLUSIVE_TRANSPORT_VERSION) &&
					caps.serverFeed === true &&
					caps.legacyBridgeRequired !== true &&
					caps.upstreamCommands !== true &&
					caps.customChannel !== true;
			}
			const roomID = urlParams.get("session") || "7RUWtGBfz2";
			const password = urlParams.get("password") || urlParams.get("pass") || urlParams.get("pw") || "false";
			const featuredMode = false;

			function applyOverlaySize() {
				const size = urlParams.get("size");
				document.body.classList.remove("small-overlay", "large-overlay");
				if (size === "small") {
					document.body.classList.add("small-overlay");
				} else if (size === "large") {
					document.body.classList.add("large-overlay");
				}
			}

			function isFullyVisible(element) {
				const containerRect = chatContainer.getBoundingClientRect();
				const elementRect = element.getBoundingClientRect();
				return elementRect.top >= containerRect.top && elementRect.bottom <= containerRect.bottom;
			}

			function removeCutOffMessages() {
				let firstMessage = chatContainer.firstElementChild;
				while (firstMessage && !isFullyVisible(firstMessage)) {
					chatContainer.removeChild(firstMessage);
					firstMessage = chatContainer.firstElementChild;
				}
			}

			function autoScroll() {
				const lastMessage = chatContainer.lastElementChild;
				if (lastMessage) {
					lastMessage.scrollIntoView({ behavior: "instant", block: "end" });
					setTimeout(() => {
						lastMessage.scrollIntoView({ behavior: "instant", block: "end" });
						removeCutOffMessages();
					}, 50);
				}
			}

			const observer = new MutationObserver(() => {
				autoScroll();
			});
			observer.observe(chatContainer, { childList: true, subtree: true });

			function escapeHtml(value) {
				return String(value == null ? "" : value)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/"/g, "&quot;")
					.replace(/'/g, "&#039;");
			}

			function addEventToOverlay(data) {
				const eventDiv = document.createElement("div");
				eventDiv.classList.add("event-message");
				let eventText = "";

				if (data.type === "follow") {
					eventText = `${data.chatname} just followed!`;
				} else if (data.type === "subscription" || data.event === "membership") {
					eventDiv.classList.add("subscription-message");
					eventText = `${data.chatname} ${data.subtitle || "subscribed!"}`;
				} else if (data.type === "donation" || data.hasDonation) {
					eventText = `${data.chatname} donated ${data.amount || data.hasDonation || ""}!`;
				}

				eventDiv.textContent = eventText;
				chatContainer.appendChild(eventDiv);
			}

			// Cross-transport dedupe: in server mode the same feed message can arrive over both
			// the websocket relay and the VDO.Ninja bridge; render only the first copy.
			var CROSS_TRANSPORT_DEDUPE_TTL_MS = 12000;
			var recentTransportDeliveries = new Map();
			function isDuplicateTransportDelivery(data) {
				if (!(urlParams.has("server") || urlParams.has("server2") || urlParams.has("server3"))) {
					return false;
				}
				if (!data || typeof data !== "object") {
					return false;
				}
				if (data.id === undefined || data.id === null) {
					return false;
				}
				if ("action" in data || "get" in data || "callback" in data || "mid" in data) {
					return false;
				}
				if (!(data.chatname || data.chatmessage || data.chatimg || data.hasDonation || data.membership || data.event || data.contentimg)) {
					return false;
				}
				var key =
					String(data.id) +
					"|" + (data.type || "") +
					"|" + (data.chatname || "") +
					"|" + String(data.chatmessage || "").slice(0, 100) +
					"|" + (data.hasDonation || "") +
					"|" + (data.event || "");
				var now = Date.now();
				recentTransportDeliveries.forEach(function (seenAt, seenKey) {
					if (now - seenAt > CROSS_TRANSPORT_DEDUPE_TTL_MS) {
						recentTransportDeliveries.delete(seenKey);
					}
				});
				if (recentTransportDeliveries.has(key)) {
					return true;
				}
				recentTransportDeliveries.set(key, now);
				return false;
			}
			// Content images are separate from chat text (including GIF-only messages).
			function appendContentImage(container, data) {
				if (typeof data.contentimg !== 'string' || !data.contentimg.trim()) return;
				const img = document.createElement('img');
				img.className = 'ssn-content-image';
				img.alt = (data.meta && data.meta.gifLabel) || 'Content image';
				img.onerror = function () { this.style.display = 'none'; };
				img.src = data.contentimg;
				container.appendChild(img);
			}

			function addMessageToOverlay(data) {
				if (isDuplicateTransportDelivery(data)) {
					return;
				}
				if (!data || (!data.chatname && !data.chatmessage && !data.contentimg && !data.hasDonation)) {
					console.error("Invalid message data", data);
					return;
				}

				if (["follow", "subscription", "donation"].includes(data.type) || data.event === "membership" || data.hasDonation) {
					if (!data.chatmessage && !data.contentimg) {
						addEventToOverlay(data);
						return;
					}
				}

				const messageContainer = document.createElement("div");
				messageContainer.classList.add("message-container");

				if (data.type) {
					messageContainer.setAttribute("data-type", data.type);
				}

				const usernameBox = document.createElement("div");
				usernameBox.classList.add("username-box");

				let sourceIcon = "";
				if (data.type === "twitch") {
					sourceIcon = `<img src="https://socialstream.ninja/sources/images/twitch.png" alt="Twitch" class="source-icon">`;
				} else if (data.type === "tiktok") {
					sourceIcon = `<img src="https://socialstream.ninja/sources/images/tiktok.png" alt="TikTok" class="source-icon">`;
				} else if (data.type === "youtube") {
					sourceIcon = `<img src="https://socialstream.ninja/sources/images/youtube.png" alt="YouTube" class="source-icon">`;
				} else if (data.type === "facebook") {
					sourceIcon = `<img src="https://socialstream.ninja/sources/images/facebook.png" alt="Facebook" class="source-icon">`;
				} else if (data.type === "kick") {
					sourceIcon = `<img src="https://socialstream.ninja/sources/images/kick.png" alt="Kick" class="source-icon">`;
				}

				let chatbadges = SocialStreamBadges.render(data.chatbadges);

				let nameStyle = "";
				if (data.nameColor) {
					nameStyle = `style="color:${data.nameColor}"`;
				}

				usernameBox.innerHTML = `
            ${data.chatimg ? `<img src="${escapeHtml(data.chatimg)}" class="avatar" alt="${escapeHtml(data.chatname)}'s avatar">` : ""}
            ${sourceIcon}
            <span class="username">${escapeHtml(data.chatname)}</span>
            <span class="badges">${chatbadges}</span>
        `;

				messageContainer.appendChild(usernameBox);

				if (data.chatmessage || data.contentimg) {
					const messageDiv = document.createElement("div");
					messageDiv.classList.add("message");

					if (data.backgroundColor) {
						messageDiv.style.backgroundColor = data.backgroundColor;
					}

					let textStyle = "";
					if (data.textColor) {
						textStyle = `style="color:${data.textColor}"`;
					}

					// textonly=true means literal chatmessage: use textContent or one HTML-template escape, never HTML decoding/filtering. HTML mode checks a display copy before rendering.
					const renderedChatMessage = data.textonly ? escapeHtml(data.chatmessage || '') : (window.SocialStreamChatHTML ? SocialStreamChatHTML.sanitize(data.chatmessage || '') : fallbackEscapeHtml(data.chatmessage || ''));
					messageDiv.innerHTML = `
				<div class="text" ${textStyle}>${renderedChatMessage}</div>
				${data.donation || data.hasDonation ? `<div class="donation">${escapeHtml(data.donation || data.hasDonation)}</div>` : ""}
			`;

					appendContentImage(messageDiv, data);
					messageContainer.appendChild(messageDiv);
				}

				chatContainer.appendChild(messageContainer);
				lastSender = data.chatname;
				lastMessageDiv = messageContainer;
			}

			if (!useServerOnlyTransport()) {
				const iframe = document.createElement("iframe");
				iframe.src = featuredMode ? `https://vdo.socialstream.ninja/?ln&password=${encodeURIComponent(password)}&salt=vdo.ninja&label=overlay&exclude=${roomID}&scene&novideo&noaudio&cleanoutput&room=${roomID}` : `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=${encodeURIComponent(password)}&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=${roomID}`;

				iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px;";
				document.body.appendChild(iframe);

				window.addEventListener("message", event => {
					if (event.source !== iframe.contentWindow) return;
					if (event.data && typeof event.data === "object" && event.data.dataReceived && typeof event.data.dataReceived === "object" && event.data.dataReceived.overlayNinja) {
						addMessageToOverlay(event.data.dataReceived.overlayNinja);
					}
				});
			}

			document.addEventListener("DOMContentLoaded", () => {
				applyOverlaySize();
			});

			var conCon = 1;
			var socketserver = false;

			var serverURL = urlParams.has("localserver") ? SocialStreamLocalServer.getWebSocketUrl() : "wss://io.socialstream.ninja";

			function setupSocket() {
				socketserver.onclose = function () {
					setTimeout(function () {
						conCon += 1;
						socketserver = new WebSocket(serverURL);
						setupSocket();
					}, 100 * conCon);
				};
				socketserver.onopen = function () {
					conCon = 1;
					socketserver.send(JSON.stringify({ join: roomID, out: 3, in: 4 }));
				};
				socketserver.addEventListener("message", function (event) {
					var resp = false;
					if (event.data) {
						var data = JSON.parse(event.data);
						addMessageToOverlay(data);
						if (data.get) {
							var ret = {};
							ret.callback = {};
							ret.callback.get = data.get;
							ret.callback.result = true;
							socketserver.send(JSON.stringify(ret));
						}
					}
				});
			}

			if (urlParams.has("server") || urlParams.has("server2")) {
				serverURL = urlParams.get("server") || urlParams.get("server2") || serverURL;
				socketserver = new WebSocket(serverURL);
				setupSocket();
			}
		</script>
	<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"f9df9d8398a04c919ae1805f16563df5","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
